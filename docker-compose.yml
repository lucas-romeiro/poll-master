services:
  app:
    container_name: pollmaster
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - .:/src
      - pollmaster-modules:/src/node_modules
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pollmaster-network
    command: npm run dev

  db:
    image: postgres:17-alpine
    container_name: pollmaster-database
    ports:
      - '${PG_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - pollmaster-network

networks:
  pollmaster-network:
    driver: bridge

volumes:
  pollmaster-modules:
  postgres_data:
