name: CI

on:
  push:
    branches:
      - main

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Create .env.development from GitHub Secrets
        run: |
          echo "PORT=${{ secrets.PORT }}" >> .env.development
          echo "NODE_ENV=development" >> .env.development
          echo "PG_HOST=${{ secrets.PG_HOST }}" >> .env.development
          echo "PG_PORT=${{ secrets.PG_PORT }}" >> .env.development
          echo "PG_USER=${{ secrets.PG_USER }}" >> .env.development
          echo "PG_PASSWORD=${{ secrets.PG_PASSWORD }}" >> .env.development
          echo "PG_DATABASE=${{ secrets.PG_DATABASE }}" >> .env.development
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.development
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run ESLint and fix
        run: npm run lint:fix

      - name: Format with Prettier
        run: npm run format

      - name: Check for remaining ESLint errors
        run: npm run lint

      - name: Check for remaining formatting issues
        run: npm run format:check
